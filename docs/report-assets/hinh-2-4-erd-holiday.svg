<text x="350" y="158" class="card">N:N</text><text x="350" y="285" class="card">1:0..1</text><text x="540" y="180" class="card">1:N</text><text x="1055" y="180" class="card">1:N</text><text x="1248" y="275" class="card">N:1</text><text x="900" y="315" class="card">1:0..N</text><text x="235" y="405" class="card">1:N</text><text x="690" y="740" class="card">1:N</text>
