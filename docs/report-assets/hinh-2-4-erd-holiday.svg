<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<defs><style>.t{font:700 30px Arial;fill:#17324d}.h{font:700 18px Arial;fill:#17324d}.s{font:14px Arial;fill:#394b57}.b{stroke:#17324d;stroke-width:2.3;rx:12}.r{stroke:#71808a;stroke-width:2.4;fill:none}.card{font:700 14px Arial;fill:#b36b00}</style></defs>
<rect width="1600" height="1050" fill="white"/><text x="800" y="48" text-anchor="middle" class="t">MÔ HÌNH THỰC THỂ LIÊN KẾT HOLIDAY FASHION</text>
<g><rect x="70" y="120" width="260" height="130" fill="#e7f1fa" class="b"/><text x="200" y="158" text-anchor="middle" class="h">USERS</text><text x="90" y="190" class="s">PK id • email • full_name</text><text x="90" y="218" class="s">status • phone • password</text></g>
<g><rect x="400" y="90" width="250" height="120" fill="#fcebd0" class="b"/><text x="525" y="130" text-anchor="middle" class="h">ROLES / PERMISSIONS</text><text x="420" y="165" class="s">role_id • permission_id</text><text x="420" y="190" class="s">code • description</text></g>
<g><rect x="400" y="275" width="250" height="130" fill="#fcebd0" class="b"/><text x="525" y="315" text-anchor="middle" class="h">AGENT_PROFILES</text><text x="420" y="347" class="s">FK user_id • business_name</text><text x="420" y="375" class="s">status • credit_limit</text></g>
<g><rect x="760" y="125" width="250" height="130" fill="#dceedd" class="b"/><text x="885" y="165" text-anchor="middle" class="h">ORDERS</text><text x="780" y="197" class="s">PK id • order_code</text><text x="780" y="225" class="s">FK user_id • type • total</text></g>
<g><rect x="1110" y="90" width="250" height="130" fill="#dceedd" class="b"/><text x="1235" y="130" text-anchor="middle" class="h">ORDER_ITEMS</text><text x="1130" y="162" class="s">FK order_id • product_id</text><text x="1130" y="190" class="s">quantity • unit_price</text></g>
<g><rect x="1110" y="300" width="250" height="130" fill="#e7f1fa" class="b"/><text x="1235" y="340" text-anchor="middle" class="h">PRODUCTS</text><text x="1130" y="372" class="s">name • price • status</text><text x="1130" y="400" class="s">image • category</text></g>
<g><rect x="760" y="350" width="250" height="130" fill="#f0e4f5" class="b"/><text x="885" y="390" text-anchor="middle" class="h">PAYMENTS</text><text x="780" y="422" class="s">FK order_id • method</text><text x="780" y="450" class="s">provider_ref • status</text></g>
<g><rect x="1110" y="515" width="250" height="130" fill="#f0e4f5" class="b"/><text x="1235" y="555" text-anchor="middle" class="h">PROMOTIONS</text><text x="1130" y="587" class="s">code • discount_value</text><text x="1130" y="615" class="s">start_at • end_at</text></g>
<g><rect x="70" y="520" width="260" height="130" fill="#e7f1fa" class="b"/><text x="200" y="560" text-anchor="middle" class="h">NOTIFICATIONS</text><text x="90" y="592" class="s">FK recipient_id</text><text x="90" y="620" class="s">title • content • is_read</text></g>
<g><rect x="400" y="630" width="250" height="130" fill="#e7f1fa" class="b"/><text x="525" y="670" text-anchor="middle" class="h">CONVERSATIONS</text><text x="420" y="702" class="s">customer_id • status</text><text x="420" y="730" class="s">created_at</text></g>
<g><rect x="760" y="700" width="250" height="130" fill="#e7f1fa" class="b"/><text x="885" y="740" text-anchor="middle" class="h">MESSAGES</text><text x="780" y="772" class="s">conversation_id • sender_id</text><text x="780" y="800" class="s">content • sent_at</text></g>
