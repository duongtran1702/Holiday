      - holiday-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: holiday-notification-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888/
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - holiday-network

  chat-service:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    container_name: holiday-chat-service
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      SERVER_PORT: 8087
      DB_HOST: mysql
      DB_PORT: 3306
